<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Q&A</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top right, #16284a, #0a0f1b 45%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #e6edf7;
        }

        /* Навигация */
        .navbar {
            background: rgba(12, 19, 34, 0.92);
            border-bottom: 1px solid #263550;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            padding: 0.7rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 700;
            color: white !important;
            display: flex;
            align-items: center;
            letter-spacing: -0.5px;
        }

        .navbar-brand i {
            color: #ffd700;
            margin-right: 10px;
            font-size: 1.8rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* Основной контейнер */
        .container {
            max-width: 450px;
            margin: 80px auto 0;
            padding: 0 15px;
            width: 100%;
        }

        /* Карточка входа */
        .auth-card {
            background: #141f35;
            border-radius: 30px;
            padding: 2.5rem;
            border: 1px solid #263550;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header i {
            font-size: 3.5rem;
            color: #74b9ff;
            margin-bottom: 1rem;
            background: #0f172a;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #f3f7ff;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #9eb0cc;
            font-size: 1rem;
        }

        /* Форма */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #d6e1f5;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group label i {
            color: #74b9ff;
            margin-right: 6px;
            width: 18px;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #263550;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #111a2e;
            color: #e6edf7;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
            background: #111a2e;
        }

        /* Кнопка */
        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #2150c7);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 80, 199, 0.5);
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 80, 199, 0.6);
        }

        .btn-login i {
            font-size: 1rem;
        }

        /* Ссылки */
        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #263550;
        }

        .auth-footer p {
            color: #9eb0cc;
            margin-bottom: 0.5rem;
        }

        .auth-footer a {
            color: #74b9ff;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: #9cc9ff;
            text-decoration: underline;
        }

        

        /* Чекбокс запомнить меня */
        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 1rem 0;
        }

        .form-check input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-check label {
            color: #9eb0cc;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* Адаптивность */
        @media (max-width: 576px) {
            .auth-card {
                padding: 1.5rem;
            }

            .auth-header h1 {
                font-size: 1.6rem;
            }

            .auth-header i {
                font-size: 2.5rem;
                width: 60px;
                height: 60px;
                line-height: 60px;
            }
        }
        .alert-fade-out {
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'question_list' %}">
                <i class="fas fa-question-circle"></i>
                Q&A
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-sign-in-alt"></i>
                <h1>Вход</h1>
                <p>Добро пожаловать обратно!</p>
            </div>

            <!-- Сообщения -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}">
                        <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% elif message.tags == 'success' %}check-circle{% else %}info-circle{% endif %} mr-2"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Имя пользователя
                    </label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Введите ваш логин" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Пароль
                    </label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Введите пароль" required>
                </div>

                <div class="form-check">
                    <input type="checkbox" name="remember" id="remember">
                    <label for="remember">Запомнить меня</label>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Войти
                </button>
            </form>

            <div class="auth-footer">
                <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
                <p style="font-size: 0.9rem;">
                    <a href="#">Забыли пароль?</a>
                </p>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function fadeOutAndRemove(element) {
            if (!element) return;
            element.classList.add('alert-fade-out');
            setTimeout(() => {
                element.remove();
            }, 350);
        }

        (function () {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach((alertEl) => {
                setTimeout(() => {
                    fadeOutAndRemove(alertEl);
                }, 4000);
            });
        })();
    </script>
</body>
</html>
